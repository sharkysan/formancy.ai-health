name: Gates

# The gates every change and every release passes, in one place (0011, as
# formancy.ai-report 0014 and formancy.ai-data 0035): ci.yml calls this on
# every pull request and every push to main, and release.yml calls it before
# anything is published, so a release's gate is CI's by construction and its
# report describes its own run. Every job but the last ends by collecting
# what it found into one results file and uploading it as
# `release-results-<key>`; the `report` job builds the release report from
# all of them and fails the run on anything its `problems` list
# (scripts/release-report/report.mjs).
#
# Four jobs leave results, because four things exist to prove: the build,
# types, packaging, licences and the repository's guards (`verify`); each
# package's suite on a runner of its own (`test`); the packed tarballs in a
# project that is not this one (`install`); and the FHIR resources the
# packages write, judged by the HL7 FHIR validator against pinned guide
# packages (`validator`, 0005). A job added here is one the report expects
# results from: it needs a collect step, and collect.mjs a reader for it.
#
# A release runs code from here with its own permissions, so third-party
# actions are pinned to commit hashes, with the tag in a comment, under
# release.yml's rule; scripts/workflows.test.mjs fails on one that is not.
on:
  workflow_call:
    inputs:
      release:
        description: "'' for CI, the tag for a release, dry-run for a rehearsal"
        type: string
        default: ''
    secrets:
      # Passed by ci.yml and never by release.yml, so a release never uploads
      # coverage and holds no secret while it runs the gates.
      CODECOV_TOKEN:
        required: false

# Read-only, for every job. Nothing in this workflow writes to the repository:
# the coverage upload authenticates with its own token, the caches are CI's
# alone and the artefacts the run's. Without this the default token carries
# whatever the repository's default is, and CodeQL says so, as a
# missing-workflow-permissions alert per job.
permissions:
  contents: read

jobs:
  # Build, types, packaging, licences and the repository's own guards: the
  # fast signal. The suites run in the `test` job below, one package per runner.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # corepack reads the packageManager field, so CI runs the exact pnpm
      # version the repo pins rather than whatever the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      # CI only. A tag's run may restore a cache a main-branch run saved, and
      # a cache holds whatever code that job ran left in the store; a release
      # or a rehearsal installs from the registry against the lockfile
      # instead, in every job here (workflows.test.mjs). The store's path is
      # assigned before it is written out, so a pnpm that cannot start fails
      # this step with its own message, never the cache step with an empty
      # path.
      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm typecheck

      # Packaging correctness (publint + attw) is a release gate, not a nicety:
      # broken exports maps are the top cause of "doesn't work in my app".
      - run: pnpm check:pkg

      # Every tarball carries LICENSE.md and NOTICE and declares the
      # source-available terms rather than the scope's Apache-2.0. On the pull
      # request rather than only at release, which is the last possible moment
      # to find out.
      - run: node scripts/verify-licenses.mjs

      # Everything a published package needs in production, and every font
      # one ships, is under a licence that allows public source and licensed
      # production use: permissive, never GPL, AGPL, non-commercial or none
      # (formancy.ai-report 0006). Read from the tree this job installed, so
      # CI sees Linux's optional platform packages where a Windows machine
      # sees its own.
      - run: node scripts/dependency-licences.mjs

      # The repository's own guards: codecov.yml matches its generator, every
      # CLA signature names the current text, upstream is depended on at exact
      # versions, no source file is past the 600-line budget, the `test`
      # job's matrix names every package with a suite, the README says what
      # LICENSE.md says, nothing names the product with HL7's marks and
      # NOTICE and the README carry HL7's notice, these workflows keep the
      # shape the release depends on, and the release report's registers
      # hold. A guard that is not a gate is a comment.
      - run: pnpm test:repo

      # What this job found, for the report: the guards' results and the
      # dist/ of every published package it built. Even when a step above
      # failed, so the report says what failed rather than that nothing came.
      # Every upload here overwrites: a job run again replaces its own earlier
      # attempt's artefact, which v4 would otherwise refuse by name, and no two
      # jobs share a key (workflows.test.mjs), so it never replaces another's.
      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job verify
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # Every package's suite, each in a job of its own on its own runner, as in
  # formancy.ai-data, where nine suites sharing one runner timed out a test
  # that takes two seconds alone. scripts/ci-test-jobs.test.mjs fails when
  # this list and the workspace's packages with a `test:coverage` script
  # disagree, so a new package cannot go untested in CI by being left off it.
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every suite reports, rather than the first failure cancelling the rest.
      fail-fast: false
      matrix:
        package: ['@formancy/health-core', '@formancy/health-questionnaire', '@formancy/health-document', '@formancy/health-ch', '@formancy/health-corpus']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # turbo builds what the package depends on first (`^build`), then runs
      # its suite and nothing else's. `--force` makes "this job did not replay
      # a cached result" a property of the command rather than an accident of
      # a fresh runner; `--summarize` writes the task's own start and end. The
      # package reaches the command through the environment, never through
      # `${{ }}` in the script.
      - run: pnpm exec turbo run test:coverage --filter="$PACKAGE" --force --summarize
        env:
          PACKAGE: ${{ matrix.package }}
      # Skipped, visibly, while the repository has no CODECOV_TOKEN -- a new
      # repository should not be red for a reason unrelated to its code -- and
      # in every release, which passes no secret. Once the secret exists the
      # upload runs and a failed upload fails the job, as upstream: a report
      # that silently did not arrive is a number nobody can read. Each job
      # uploads its own package's report; Codecov merges them by commit. A
      # secret cannot be tested in `if:` directly, so it goes through the
      # environment.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        # The commit formancy.ai-data pinned for v7.1.1, read from the action's repository on 2026-10-09.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # The package's suite, the test files the checkout holds for it, its
      # coverage and turbo's own start and end of the task, and the dist/ of
      # every published package turbo built for it.
      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job test --package "$PACKAGE"
        env:
          PACKAGE: ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # Every job above runs inside the workspace, against the tree it built from --
  # and a workspace sibling resolves a package through a symlink to its SOURCE
  # directory. So an exports map that is wrong for a real consumer can be right
  # for every test in the repository. This packs the tarballs, installs them
  # into a plain npm project, type-checks it with skipLibCheck OFF and runs it
  # under Node. Its own job so that `verify` stays the fast signal and a red
  # "install" says what is wrong. The tarballs it installed and ran are kept as
  # the run's `release-tarballs`: a release publishes exactly these, and the
  # report holds each to the dist/ every other job built.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The tarballs are built output, so there is nothing to pack without this.
      - run: pnpm build

      - run: node scripts/install-test.mjs --keep-tarballs release-tarballs

      # The install gate's record, test-results/install.json, which it
      # writes however it ends: whether it passed, the Node and npm, what a
      # clean install resolved, and each tarball's hashes.
      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job install
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs/
          if-no-files-found: error
          overwrite: true

  # The HL7 FHIR validator over what the packages write (0005): the release
  # docs/release/validator.json pins, against exactly the packages
  # docs/release/ig-packages.json registers, each fetched by exact version
  # and refused unless its SHA-256 is the registered one, then run offline,
  # with no terminology server and no HTTP at all. An error fails the job; a
  # warning fails it unless scripts/validator/warnings.json names it with
  # its reason; and each broken resource of the corpus must be refused for
  # exactly what it breaks. Its own job, because it needs a Java and a
  # download of its own, and a red "validator" says which kind of wrong it
  # is.
  validator:
    runs-on: ubuntu-latest
    # A run that unpacked every package took 2 min 20 s, and 2 min 31 s
    # timed again, on a desktop on 17 October 2026 (Windows 11, Java 17;
    # 0005 says on what); the bound is for a registry or a runner having a
    # bad day, not for the work.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The corpus is written by health-core as built, not by its source.
      - run: pnpm build

      # The validator's JAR needs Java 17 (its classes are version 61). A
      # third-party action in all but name, pinned like one.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # CI only, like the pnpm store, and keyed on the registers: a cached
      # download is used only once its SHA-256 is the registered one, and a
      # release fetches everything from where the registers say.
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: |
            .fhir-cache/validator
            .fhir-cache/packages
          key: fhir-cache-${{ hashFiles('docs/release/validator.json', 'docs/release/ig-packages.json') }}

      - run: node scripts/validator.mjs --java "$JAVA_HOME/bin/java"

      # The registers held against the files this job downloaded and the run
      # it just made, which pnpm test:repo in `verify` cannot see and skips.
      # Here none of those cases may skip: VALIDATOR_GATE_RAN says the gate
      # ran, and the suite fails when a file they read is missing.
      - run: pnpm exec vitest run --config vitest.repo.config.mts scripts/validator/registers.test.mjs
        env:
          VALIDATOR_GATE_RAN: 'true'

      # What this job found, for the report: the gate's own file, and the run
      # of the registers' test just made, whose passes account for the cases
      # `verify` skips (0011). After both, and whatever the gate found.
      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job validator
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

      # The results, the corpus as written, the validator's own outcomes and
      # its console, whatever the run found.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validator-results
          path: |
            test-results/validator.json
            test-results/validator/
          if-no-files-found: error
          overwrite: true

  # The release report (0011), built from what every job above found: what
  # this run was tested on -- Node, pnpm, TypeScript, upstream @formancy/*,
  # the FHIR version, the validator the gate ran and the Java it ran on --
  # every package's results, the validator gate's verdict held to the
  # registers, the build identity of what a release publishes, the release
  # gates and the known limitations. It fails the run on anything in its
  # problems -- a job that ended other than success, an artefact missing,
  # twice or another run's, a test skipped that the validator job did not
  # pass, or failed, a resource not judged as the corpus expects, a tarball
  # whose dist/ is not every job's -- and writes the report either way, into
  # the job summary and the `release-report` artefact. For a release or a
  # rehearsal it also writes the release body, and fails here, before
  # anything is published, when the body has no changelog section or is
  # longer than GitHub accepts.
  #
  # The limit is not measured on CI yet: it is verify's, whose install this
  # job shares, until three green runs give a slowest time to triple. The
  # checkout keeps the whole history, for a document's last change when a
  # gate's evidence is a document.
  report:
    needs: [verify, test, install, validator]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # What the checkout says it is tested with is read from what is
      # installed: @formancy/spec, TypeScript and the rest, and health-core's
      # FHIR version through TypeScript's parser. Nothing is built here; the
      # report reads every other job's results.
      - run: pnpm install --frozen-lockfile

      # One directory per artefact, never merged: two jobs that wrote one key
      # stay two, and the report says so.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-results-*
          path: release-results

      - name: The report, from what every job found
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
        run: node scripts/release-report/report.mjs --results release-results --out release-report

      - name: The report, in the run's summary
        if: ${{ !cancelled() }}
        run: cat release-report/release-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-report
          path: release-report/
          if-no-files-found: error
          overwrite: true
