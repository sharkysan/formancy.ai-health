<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formancy Health – Demo</title>
    <meta
      name="description"
      content="A synthetic Swiss referral filled in your browser, and the HL7® FHIR® R4 resources Formancy Health, a source-available library, makes of it: a Questionnaire, its QuestionnaireResponse and a CH ORF document."
    />
    <!-- The one address the demo is served at, its Worker's route (apps/demo/wrangler.json), which scripts/demo.test.mjs holds this to. -->
    <link rel="canonical" href="https://formancy.ai/health/" />
    <!-- No robots meta, and no X-Robots-Tag among the headers: the demo is meant to be found (0018). -->
    <!-- No icon, said rather than requested: otherwise every load is a 404. -->
    <link rel="icon" href="data:," />
    <!-- The faces are the build's own (src/styles/fonts.css): the page asks no other site for anything. -->
    <!-- No theme-color: its value would be a colour typed here, which no theme declares and nothing holds. -->
  </head>
  <body>
    <noscript>The demo runs in your browser and needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
