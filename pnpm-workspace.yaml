packages:
  - "packages/*"
  # Applications: private, never published: the demo (apps/demo, 0012).
  - "apps/*"

# Packages whose install scripts may run: none. Nothing this workspace
# installs today has one -- formancy.ai-report's esbuild arrives there with
# Angular's build, which this repository does not have -- and pnpm runs no
# install script a package is not named here for. An entry arrives with the
# package that needs it, and says why.
allowBuilds: {}

# Shared dependency versions live here so the packages cannot drift apart.
# They are formancy.ai-report's, which are formancy.ai-data's, so one machine
# serves every repository. What only Report's builders and Studio need --
# marked -- is not here; axe-core and Playwright are, for the demo's browser
# gate (0012), at Report's ranges, so one browser revision serves both.
catalog:
  # The TypeScript line formancy.ai compiles under: its Angular 22 declares
  # `typescript: ">=6.0 <6.1"`. The declarations this repository will consume
  # from @formancy/* were emitted by 6.0.x, so there is one version across
  # the repositories.
  typescript: ~6.0.3

  vitest: ^5.0.1
  "@vitest/coverage-v8": ^5.0.1

  tsdown: ^0.23.0
  publint: ^0.3.24
  "@arethetypeswrong/cli": ^0.18.5
  "@types/node": ^22.10.0

  # The repository's guards read YAML: the workflows' jobs and matrices, and
  # this file's packages.
  yaml: ^2.9.1

  # The demo's browser gate, measured in Chromium, Firefox and WebKit (0012, 0014).
  axe-core: ^4.13.0
  playwright: ^1.63.0

# pnpm installs nothing released less than a day ago. Formancy Report 0.1.0,
# from this repository's own rightsholder, was released on 16 October 2026
# and taken by health-corpus the next morning, for the PDFs H06 attaches;
# each release is named, so a later one waits its day as any other does.
minimumReleaseAgeExclude:
  - '@formancy/report-core@0.1.0'
  - '@formancy/report-render-pdf@0.1.0'
  - '@formancy/report-runtime@0.1.0'
  - '@formancy/report-spec@0.1.0'
